services:
  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/php/conf.d/zzz-local.ini:/usr/local/etc/php/conf.d/zzz-local.ini:ro
    env_file:
      - .env
    command: sh -c 'php artisan optimize:clear && npm run dev & exec php-fpm'
    ports:
      - "5173:5173"
    depends_on:
      - redis
      - pgsql
    networks:
      - laravel

  nginx:
    image: nginx:alpine
    container_name: laravel-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    networks:
      - laravel

  pgsql:
    image: postgres:16-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 5
    container_name: laravel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}-5432:5432"
    networks:
      - laravel

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5
    container_name: laravel-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - laravel

  # # Queue Worker
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel-queue
    restart: unless-stopped
    command: sh -c "php artisan optimize:clear && php artisan queue:work --queue=default --sleep=3 --tries=3 --delay=3"
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      - redis
      - pgsql
    environment:
      APP_ENV: ${APP_ENV:-local}
    networks:
      - laravel

  # # Scheduler (cron)
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel-scheduler
    restart: unless-stopped
    command: php artisan schedule:work --verbose
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      pgsql:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
    networks:
      - laravel

volumes:
  postgres_data:
  redis_data:

networks:
  laravel:
    driver: bridge
